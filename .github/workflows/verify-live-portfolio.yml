name: Verify published portfolio
on:
  push:
    branches: [publish-portfolio-v5-20260928]
    paths: [.github/workflows/verify-live-portfolio.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: be3a8e4336ae4b55c40649445a9a8ea94f8149ce
      - name: Verify live pages and assets against the approved commit
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import pathlib
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          base = 'https://parrwnago.github.io/'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().strip('\0').split('\0')
          paths = [p for p in paths if p != '.nojekyll' and p != 'README.md']
          expected = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).digest() for p in paths}
          def check(p):
              url = base + urllib.parse.quote(p) + '?deployment=be3a8e4'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Portfolio-Deployment-Verification', 'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      h = hashlib.sha256()
                      while True:
                          chunk = r.read(1024 * 1024)
                          if not chunk: break
                          h.update(chunk)
                      if r.status != 200: return p, 'HTTP ' + str(r.status)
                      if h.digest() != expected[p]: return p, 'Content differs from approved commit'
                  return p, None
              except Exception as e:
                  return p, str(e)
          pending = paths
          for attempt in range(4):
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  results = list(pool.map(check, pending))
              failures = [(p, e) for p, e in results if e is not None]
              if not failures: break
              print('Pending checks:', failures)
              pending = [p for p, _ in failures]
              if attempt < 3: time.sleep(20)
          if failures:
              raise RuntimeError('Live site verification failed: ' + repr(failures))
          print('LIVE_VERIFIED: ' + str(len(paths)) + ' pages/assets exactly match approved commit be3a8e4336ae4b55c40649445a9a8ea94f8149ce')
          print('HTML_PAGES: ' + str(sum(p.endswith('.html') for p in paths)))
          print('ORIGINAL_VIDEOS: ' + str(sum(p.endswith('.mp4') for p in paths)))
          assert not any('quadrotor_reconstruction' in p for p in paths)
          assert '<video' not in pathlib.Path('projects/quadrotor.html').read_text()
          print('QUADROTOR: no video; rejected reconstruction absent')
          print('PUBLIC_URL: ' + base)
          PY
