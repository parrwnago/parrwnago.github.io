name: Verify published CV resume
on:
  push:
    branches: [cv-actual-resume]
    paths: [.github/workflows/verify-cv-resume.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public website bytes to approved files
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, time, urllib.request
          expected = {
            'cv.html': 'bf991f4046f6b13e6dd840375202737cc9f580816d01b8b3353894472f0e3a6e',
            'cv.css': '335038eb192d736fa2eed34c6b4c266c386dcd89fd8caa7f97ee019391081db9',
            'cv.js': '7a80e10e2e6c266092f5d7fe41923c20a8a2235cc64b59ffa76774919c7b5556',
            'assets/docs/Yufeng-Wang-Resume.pdf': 'ec8c390a924f3e63275d3e15a868c7b8fdaa84a5de307c5df575f81155577a0b',
            'assets/images/resume-page-1.webp': '06c52f3099153cf491709075504331e1a949ea53b22ac5e95a4790eb1588bf48',
            'assets/images/resume-page-2.webp': '22536142e89b4f23934e0f4d154d5ea2ddc3a4c939b49f1f2e515668a7b7caf0'
          }
          def check(item):
              path, sha = item
              try:
                  req = urllib.request.Request('https://parrwnago.github.io/'+path+'?v=resume-website', headers={'User-Agent':'Portfolio-Verification','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data = r.read()
                      assert r.status == 200
                  assert hashlib.sha256(data).hexdigest() == sha, 'Content not updated yet'
                  if path.endswith('.pdf'):
                      assert data.startswith(b'%PDF-'), 'Incorrect PDF response'
                  return path, None
              except Exception as exc:
                  return path, str(exc)
          pending = list(expected.items())
          failures = []
          for attempt in range(8):
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  results = list(pool.map(check,pending))
              failures = [(p,e) for p,e in results if e]
              if not failures: break
              print('Pending:', failures)
              pending = [(p,expected[p]) for p,e in failures]
              if attempt < 7: time.sleep(15)
          assert not failures, failures
          print('LIVE_VERIFIED: all 6 CV files exactly match the approved update.')
          print('CV_URL: https://parrwnago.github.io/cv.html')
          print('PDF: correct document, successful HTTP response, matching SHA-256.')
          print('APPROVED_COMMIT: 0f86dfb166064856910bff38ec55d7f12e4fc167')
          PY
