name: Replace active spherical wheel CAD images
on:
  push:
    branches: [update-active-wheel-cad-20261012]
    paths: [.github/workflows/refresh-active-wheel-images.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: update-active-wheel-cad-20261012
      - name: Import verified image replacement without changing other pages
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, http.cookiejar, io, pathlib, subprocess, urllib.parse, urllib.request, zipfile
          from html.parser import HTMLParser
          expected_zip = 'd31f3066c11d609e4d84ba66e466569835343469151f96bd7d426decbd139544'
          before = {
              'assets/images/active-caster-perspective.webp':'19b48c60adc40e0cf0acd3645f08b6288b2d7c56',
              'assets/images/active-caster-perspective-original.png':'a3c890e75283430c71644039f7b1c14afb6380fd',
              'assets/images/active-caster-section.webp':'e6f7df68d0f01c51b355d3f856a29519da78fb9e',
              'assets/images/active-caster-section-original.png':'ccdd7515b0513272f013fbfeaf82f2079bb44b7c',
              'index.html':'365d645880013c7479fc0b912959af65d6f8d465',
              'research/active-spherical-caster.html':'6b0231a7ac59ad340b83ba88af5d2f12e839f5e4'}
          expected = {
              'index.html':'847fb92e56ef72404411cb4f4363eecf9c6a50fd74ac23855cfc551a5d99b4cb',
              'research/active-spherical-caster.html':'4941a956095368a7d14ba85d8b16de512ad30a62e89da56d6bcc3f00dd780545',
              'assets/images/active-caster-overview-20261012-original.png':'5b9bd717d348c8b398b939b85924329c8d48f77dc066cadb65813900e66686d1',
              'assets/images/active-caster-overview-20261012.webp':'924d59251f2398f5cc1a387ffd9c20801eb469d8e2d33c7d40e49d393332042e',
              'assets/images/active-caster-side-20261012-original.png':'d29f51d5d7dc91ac1d7a8bea4acdd20070e228b192671812ba4a0b77f2cadad2',
              'assets/images/active-caster-side-20261012.webp':'91677bab02216bdd5988fd6369443ee952bb3fa0ff18a353eb1ba0a164a150fd'}
          deleted = [p for p in before if p.startswith('assets/images/')]
          for name, sha in before.items():
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==sha, 'Concurrent change: '+name
          for name in expected.keys()-before.keys():
              assert not pathlib.Path(name).exists(), 'New image name already exists'
          class Form(HTMLParser):
              def __init__(self):
                  super().__init__(); self.action=None; self.fields={}
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='form' and a.get('id')=='download-form': self.action=a.get('action')
                  if tag=='input' and a.get('type')=='hidden' and a.get('name'): self.fields[a['name']]=a.get('value','')
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          url='https://drive.usercontent.google.com/download?id=1BmnGpwOaMRCSAQtxGz_mD8EytoSVtwk5&export=download&confirm=t'
          for attempt in range(3):
              with opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60) as response:
                  data=response.read(3000001)
              assert len(data)<=3000000, 'Unexpected transfer size'
              if zipfile.is_zipfile(io.BytesIO(data)): break
              form=Form(); form.feed(data.decode(errors='replace'))
              assert form.action and urllib.parse.urlparse(form.action).hostname in ('drive.usercontent.google.com','drive.google.com'), 'Transfer unavailable'
              url=form.action+'?'+urllib.parse.urlencode(form.fields)
          assert hashlib.sha256(data).hexdigest()==expected_zip, 'ZIP checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert set(z.namelist())==set(expected) and len(z.namelist())==len(expected)
              assert sum(x.file_size for x in z.infolist())<3000000
              payload={name:z.read(name) for name in expected}
              for name, sha in expected.items(): assert hashlib.sha256(payload[name]).hexdigest()==sha, name
          for name, data in payload.items():
              path=pathlib.Path(name); path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(data)
          for name in deleted: pathlib.Path(name).unlink()
          for path in pathlib.Path('.').rglob('*.html'):
              text=path.read_text()
              assert 'active-caster-perspective' not in text and 'active-caster-section' not in text, str(path)
          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ('src','href','poster'):
                      val=attrs.get(key,''); parsed=urllib.parse.urlparse(val)
                      if parsed.scheme or parsed.netloc or not parsed.path: continue
                      target=(self.base/urllib.parse.unquote(parsed.path)).resolve()
                      assert target.is_file(), 'Missing local target: '+str(target)
          for name in ('index.html','research/active-spherical-caster.html'):
              parser=Links();parser.base=pathlib.Path(name).parent;parser.feed(pathlib.Path(name).read_text())
          workflow=pathlib.Path('.github/workflows/refresh-active-wheel-images.yml')
          workflow.unlink()
          changes=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          assert (changes|untracked)==set(expected)|set(deleted)|{str(workflow)}, 'Unexpected changed files'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*expected,*deleted,str(workflow)],check=True)
          subprocess.run(['git','commit','-m','Replace old active wheel CAD views with the two new original screenshots'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/update-active-wheel-cad-20261012'],check=True)
          print('VERIFIED: two new CAD images, matching lightbox originals and homepage thumbnail; four old image assets removed. Other pages unchanged.')
          PY
