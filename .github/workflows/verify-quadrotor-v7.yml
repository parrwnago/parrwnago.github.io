name: Verify published quadrotor page
on:
  push:
    branches: [quadrotor-report-redesign-v7]
    paths: [.github/workflows/verify-quadrotor-v7.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a0a3d296391654cee7fbd8ccbf77821d7554c076
          fetch-depth: 2
      - name: Verify the eleven updated public files
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, pathlib, subprocess, time, urllib.parse, urllib.request
          paths = subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines()
          assert len(paths) == 11, paths
          expected = {p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          def check(p):
              url = 'https://parrwnago.github.io/' + urllib.parse.quote(p) + '?deployment=a0a3d29'
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Portfolio-Verification'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return p, r.status == 200 and hashlib.sha256(r.read()).hexdigest() == expected[p]
              except Exception:
                  return p, False
          pending = paths
          for attempt in range(6):
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  results=list(pool.map(check,pending))
              pending=[p for p,ok in results if not ok]
              if not pending:break
              print('Awaiting deployment:',pending)
              if attempt < 5:time.sleep(15)
          assert not pending, pending
          assert '<video' not in pathlib.Path('projects/quadrotor.html').read_text()
          print('LIVE_VERIFIED: all eleven quadrotor/homepage/report/image files match approved commit a0a3d296391654cee7fbd8ccbf77821d7554c076')
          print('No quadrotor video added. Both original PDFs and six original figure assets verified.')
          PY
