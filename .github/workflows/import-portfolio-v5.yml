name: Import approved portfolio v5

on:
  push:
    branches: [publish-portfolio-v5-20260928]
    paths: [.github/workflows/import-portfolio-v5.yml]

permissions:
  contents: write

concurrency:
  group: import-approved-portfolio-v5
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: publish-portfolio-v5-20260928
          fetch-depth: 1
      - name: Download and verify approved website package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import http.cookiejar
          import pathlib
          import shutil
          import stat
          import tempfile
          import urllib.parse
          import urllib.request
          import zipfile
          from html.parser import HTMLParser

          expected = '3562c878fc3b4cd3fc1bce0d53ad5823b93658fde5dbcd377e1399f0be1f8a16'
          file_id = '1IAQyuflWsvcz7qnBuQwFG8EJheqrS7Ad'
          url = 'https://drive.usercontent.google.com/download?' + urllib.parse.urlencode({'id': file_id, 'export': 'download', 'confirm': 't'})
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          class DownloadForm(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.action = None
                  self.fields = {}
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'form' and a.get('id') == 'download-form':
                      self.action = a.get('action')
                  if tag == 'input' and a.get('type') == 'hidden' and a.get('name'):
                      self.fields[a['name']] = a.get('value', '')

          with tempfile.TemporaryDirectory() as tmp:
              archive = pathlib.Path(tmp) / 'site.zip'
              for attempt in range(3):
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with opener.open(request, timeout=90) as response:
                      with archive.open('wb') as out:
                          shutil.copyfileobj(response, out)
                  if zipfile.is_zipfile(archive):
                      break
                  html = archive.read_text(errors='replace')
                  form = DownloadForm()
                  form.feed(html)
                  if not form.action or urllib.parse.urlparse(form.action).hostname not in ('drive.usercontent.google.com', 'drive.google.com'):
                      raise RuntimeError('The public transfer did not return a downloadable ZIP; no site files have changed.')
                  url = form.action + '?' + urllib.parse.urlencode(form.fields)
              if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
                  raise RuntimeError('Package checksum mismatch; refusing to import.')
              with zipfile.ZipFile(archive) as z:
                  entries = z.infolist()
                  if len(entries) != 73:
                      raise RuntimeError('Unexpected number of package files.')
                  allowed_ext = {'.html', '.css', '.js', '.md', '.txt', '.xml', '.svg', '.png', '.webp', '.jpg', '.pdf', '.mp4'}
                  total = 0
                  for entry in entries:
                      p = pathlib.PurePosixPath(entry.filename)
                      if p.is_absolute() or '..' in p.parts or '.git' in p.parts or '.github' in p.parts:
                          raise RuntimeError('Unsafe archive path.')
                      if stat.S_ISLNK(entry.external_attr >> 16):
                          raise RuntimeError('Symlinks are not allowed.')
                      if p.name != '.nojekyll' and p.suffix not in allowed_ext:
                          raise RuntimeError('Unexpected file type.')
                      if 'quadrotor_reconstruction' in str(p):
                          raise RuntimeError('Rejected media must not be published.')
                      total += entry.file_size
                  if total > 100_000_000:
                      raise RuntimeError('Unexpected expanded package size.')
                  for entry in entries:
                      target = pathlib.Path(entry.filename)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(entry))
                  videos = list(pathlib.Path('assets/video').glob('*.mp4'))
                  if len(videos) != 8:
                      raise RuntimeError('Expected exactly eight original project recordings.')
                  quad = pathlib.Path('projects/quadrotor.html').read_text()
                  if '<video' in quad or 'quadrotor_reconstruction' in quad:
                      raise RuntimeError('The quadrotor page must remain without a video.')
              print('Verified and imported 73 public website files. Original videos: 8. Quadrotor video: none.')
          PY
      - name: Commit site to staging branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .
          if git diff --cached --quiet; then
            echo 'The approved site is already imported.'
          else
            git commit -m 'Stage approved dark-theme research portfolio and original media'
            git push origin HEAD:refs/heads/publish-portfolio-v5-20260928
          fi
          echo "Imported commit: $(git rev-parse HEAD)"
          echo "Imported tree: $(git rev-parse HEAD^{tree})"
