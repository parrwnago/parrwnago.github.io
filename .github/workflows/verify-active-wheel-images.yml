name: Verify published active wheel images
on:
  push:
    branches: [update-active-wheel-cad-20261012]
    paths: [.github/workflows/verify-active-wheel-images.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live pages, original images, and preservation of other content
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, time, urllib.parse, urllib.request
          from html.parser import HTMLParser
          repo='parrwnago/parrwnago.github.io'
          commit='1279e5b61b06da55b13b904e117cb889f4c4f529'
          before='eafd94feff9f5aa6856f85476eb528b24dfc30b8'
          base='https://parrwnago.github.io/'
          new_images={
            'assets/images/active-caster-overview-20261012-original.png',
            'assets/images/active-caster-overview-20261012.webp',
            'assets/images/active-caster-side-20261012-original.png',
            'assets/images/active-caster-side-20261012.webp'}
          old_images={
            'assets/images/active-caster-perspective-original.png',
            'assets/images/active-caster-perspective.webp',
            'assets/images/active-caster-section-original.png',
            'assets/images/active-caster-section.webp'}
          def tree(sha):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/trees/'+sha+'?recursive=1',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Portfolio-CAD-Verification'})
            with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
            assert not data.get('truncated')
            return {e['path']:e for e in data['tree'] if e['type']=='blob'}
          old,new=tree(before),tree(commit)
          expected_changed=new_images|old_images|{'index.html','research/active-spherical-caster.html'}
          changed={p for p in old.keys()|new.keys() if old.get(p,{}).get('sha')!=new.get(p,{}).get('sha')}
          assert changed==expected_changed, 'Unexpected production changes'
          assert not old_images & new.keys()
          assert sum(p.endswith('.mp4') for p in new)==12
          selected={p:e for p,e in new.items() if p in new_images or p=='assets/docs/Yufeng-Wang-Resume.pdf' or pathlib.PurePosixPath(p).suffix in {'.html','.css','.js'}}
          def verify(item):
            p,e=item
            try:
              req=urllib.request.Request(base+urllib.parse.quote(p)+'?cad='+commit[:7],headers={'Cache-Control':'no-cache','User-Agent':'Portfolio-CAD-Verification'})
              with urllib.request.urlopen(req,timeout=30) as r:
                assert r.status==200
                data=r.read()
              assert len(data)==e['size']
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==e['sha']
              return item,None
            except Exception as exc: return item,str(exc)
          pending=list(selected.items())+[('',new['index.html'])]
          for attempt in range(12):
            with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: checked=list(pool.map(verify,pending))
            failures=[(item,error) for item,error in checked if error]
            if not failures: break
            print('Waiting for deployment:',[(item[0],error) for item,error in failures])
            pending=[item for item,error in failures]
            if attempt<11: time.sleep(10)
          assert not failures, 'Live files did not match committed replacement'
          class Images(HTMLParser):
            def __init__(self): super().__init__();self.images=[];self.links=[]
            def handle_starttag(self,tag,attrs):
              attrs=dict(attrs)
              if tag=='img': self.images.append(attrs)
              if tag=='a': self.links.append(attrs)
          def read_page(path):
            with urllib.request.urlopen(base+path+'?cad='+commit[:7],timeout=30) as r:return r.read().decode()
          text=read_page('research/active-spherical-caster.html')
          page=Images();page.feed(text)
          gallery=[i for i in page.images if 'active-caster-' in i.get('src','')]
          assert [i['src'] for i in gallery]==['../assets/images/active-caster-overview-20261012.webp','../assets/images/active-caster-side-20261012.webp']
          assert [(i.get('width'),i.get('height')) for i in gallery]==[('812','719'),('833','779')]
          assert all('active-caster-perspective' not in s and 'active-caster-section' not in s for s in [text,read_page('index.html')])
          assert len([a for a in page.links if a.get('href','').endswith('20261012-original.png')])==2
          assert 'assets/images/active-caster-overview-20261012.webp' in read_page('index.html')
          summary={'commit':commit,'public_files_verified':len(selected),'root_homepage_verified':True,'new_CAD_images':2,'original_lightbox_images':2,'old_CAD_assets_removed':4,'homepage_thumbnail_updated':True,'other_pages_unchanged':True,'all_12_existing_videos_unchanged':True,'url':base+'research/active-spherical-caster.html'}
          print('LIVE_VERIFIED: '+json.dumps(summary))
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## CAD image update verified\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          PY
